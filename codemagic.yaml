workflows:
  ios-app-store:
    name: iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Must match the App Store Connect API key name in Codemagic → Settings → Integrations.
      app_store_connect: GatherKey
    environment:
      vars:
        XCODE_WORKSPACE: GatherLoopOC/GatherLoopOC.xcworkspace
        XCODE_SCHEME: GatherLoopOC
        BUNDLE_ID: com.company.Gatherlooper
        # App Store Connect → App Information → Apple ID. Replace 0 before relying on build numbers.
        APP_STORE_APPLE_ID: 0
      xcode: latest
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          cd GatherLoopOC
          pod install
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch or create the App Store profile
        script: |
          KEY_PATH="$CM_BUILD_DIR/ios_distribution_private_key"
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > "$KEY_PATH"
          else
            openssl genrsa -out "$KEY_PATH" 2048
          fi
          chmod 600 "$KEY_PATH"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --strict-match-identifier \
            --certificate-key "@file:${KEY_PATH}" \
            -v
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd GatherLoopOC
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination generic/platform=iOS -sdk iphoneos"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
