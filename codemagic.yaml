workflows:
  ios-app-store:
    name: iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Must match the App Store Connect API key name in Codemagic → Settings → Integrations.
      app_store_connect: GatherKey
    environment:
      vars:
        XCODE_WORKSPACE: GatherLoopOC/GatherLoopOC.xcworkspace
        XCODE_SCHEME: GatherLoopOC
        BUNDLE_ID: com.company.Gatherlooper
      xcode: latest
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          cd GatherLoopOC
          pod install
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch or create the App Store profile
        script: |
          KEY_PATH="$CM_BUILD_DIR/ios_distribution_private_key"
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > "$KEY_PATH"
          else
            openssl genrsa -out "$KEY_PATH" 2048
          fi
          chmod 600 "$KEY_PATH"
          set +e
          CREATE_LOG=$(app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key "@file:${KEY_PATH}" \
            --save 2>&1)
          CREATE_STATUS=$?
          set -e
          printf '%s\n' "$CREATE_LOG"
          if [ "$CREATE_STATUS" -ne 0 ]; then
            printf '%s\n' "$CREATE_LOG" | grep -E -q "409|already have a current Distribution certificate|maximum number of certificates"
            echo "Distribution certificate quota is full. Removing existing distribution certificates."
            app-store-connect certificates list --type IOS_DISTRIBUTION --json > /tmp/certs-ios.json || echo '[]' > /tmp/certs-ios.json
            app-store-connect certificates list --type DISTRIBUTION --json > /tmp/certs-dist.json || echo '[]' > /tmp/certs-dist.json
            python3 - << 'PY'
import json, subprocess
ids = []
for path in ("/tmp/certs-ios.json", "/tmp/certs-dist.json"):
    raw = open(path).read().strip()
    start = raw.find("[")
    if start < 0:
        start = raw.find("{")
    if start < 0:
        continue
    data = json.loads(raw[start:])
    if isinstance(data, dict):
        data = data.get("data", [])
    for item in data:
        if isinstance(item, dict) and item.get("id"):
            ids.append(item["id"])
for cid in dict.fromkeys(ids):
    print("Deleting certificate", cid)
    subprocess.check_call(["app-store-connect", "certificates", "delete", cid])
PY
            app-store-connect certificates create \
              --type IOS_DISTRIBUTION \
              --certificate-key "@file:${KEY_PATH}" \
              --save
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --strict-match-identifier \
            --certificate-key "@file:${KEY_PATH}" \
            -v
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd GatherLoopOC
          APPLE_ID=$(app-store-connect apps list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier \
            --json | python3 -c 'import json,sys; data=json.load(sys.stdin); data=data.get("data", data) if isinstance(data, dict) else data; print(data[0]["id"])')
          echo "App Store Apple ID: $APPLE_ID"
          LATEST=$(app-store-connect get-latest-build-number "$APPLE_ID" --platform IOS --all-versions 2>/dev/null | tail -n 1 || true)
          case "$LATEST" in
            ''|*[!0-9]*) LATEST=1 ;;
          esac
          NEXT=$((LATEST + 1))
          echo "Next build number: $NEXT"
          agvtool new-version -all "$NEXT"
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination generic/platform=iOS -sdk iphoneos"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
